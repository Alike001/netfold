[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fuzz.runs = 256
invariant.runs = 128
invariant.depth = 64
invariant.fail_on_revert = false
invariant.shrink_run_limit = 5000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
